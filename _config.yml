# =============================================
#  Baydrogo Blog — Jekyll Konfigürasyonu
# =============================================

title: "Baydrogo"
description: "Okuma, yazma ve not alma üzerine kısa notlar, uzun yazılar."
tanitim: "Okuma, yazma, not alma ve dijital araçlar üzerine kısa notlar ve uzun yazılar; arada serbest yazılar."
bulten: "https://buttondown.email/baydrogo"
kenar_cubugu: sol   # sol | sag
author: "Baydrogo"

url: "https://baydrogo.com"
baseurl: ""

# İsteğe bağlı IndieWeb bağlantıları. Doldurulanlar sayfanın <head> kısmına eklenir.
# mastodon: "https://mastodon.social/@baydrogo"   # rel="me" doğrulaması için
# webmention: "baydrogo.com"                      # webmention.io kullanıcı adı

# Yorumlar (bkz. yorum-worker/). İki değer de dolu olduğunda form görünür.
yorum:
  worker_url:          # örn. https://baydrogo-yorum.<alt-alan>.workers.dev
  turnstile_site_key:  # Cloudflare Turnstile site anahtarı (herkese açık)

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 15
paginate_path: "/sayfa/:num/"

permalink: /:title/

lang: tr
timezone: Europe/Istanbul

markdown: kramdown
highlighter: rouge

# Yazılar: _posts/ (başlıklı). Notlar: _posts/notlar/ (başlıksız, adres ilk kelimelerden).
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      tur: "yazi"
  - scope:
      path: "_posts/notlar"
      type: "posts"
    values:
      layout: "not"
      tur: "not"
      permalink: "/:year/:month/:day/:title/"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .obsidian
  - README.md
  - CLAUDE.local.md
  - .claude
  - scripts/
  - yorum-worker/
