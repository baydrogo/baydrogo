{%- assign gb = page.geri_baglantilar -%}
{%- if gb and gb.size > 0 %}
<section class="geri-baglantilar">
  <h2>Bağlantılı yazılar</h2>
  <ul>
    {%- for b in gb %}
    <li>
      <a href="{{ b.url | relative_url }}">{{ b.baslik }}</a>
      {%- if b.baglam != "" %}<p>{{ b.baglam }}</p>{% endif %}
    </li>
    {%- endfor %}
  </ul>
</section>
{%- endif %}
