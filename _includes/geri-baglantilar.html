{%- assign gb = page.geri_baglantilar -%}
{%- if gb and gb.size > 0 %}
<section class="geri-baglantilar">
  <h2>Bağlantılı yazılar</h2>
  <ul class="kartlar">
    {%- for b in gb %}
    <li>
      <a class="kart" href="{{ b.url | relative_url }}">
        <span class="kart-govde">
          <span class="kart-baslik">{{ b.baslik }}</span>
          {%- if b.baglam != "" %}<span class="kart-baglam">{{ b.baglam }}</span>{% endif %}
        </span>
        <span class="kart-ok" aria-hidden="true">›</span>
      </a>
    </li>
    {%- endfor %}
  </ul>
</section>
{%- endif %}
