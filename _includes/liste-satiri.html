{%- assign g = include.girdi -%}
{%- if g.tur == "not" -%}
<div class="post-row note-row h-entry">
  <a class="post-date u-url" href="{{ g.url | relative_url }}"><time class="dt-published" datetime="{{ g.date | date_to_xmlschema }}">{{ g.date | date: "%d.%m.%Y" }}</time> ∞</a>
  <div class="note-body e-content">{{ g.content }}</div>
</div>
{%- else -%}
<div class="post-row h-entry">
  <span class="post-date"><time class="dt-published" datetime="{{ g.date | date_to_xmlschema }}">{{ g.date | date: "%d.%m.%Y" }}</time></span>
  <a class="post-link p-name u-url" href="{{ g.url | relative_url }}">{{ g.title }}</a>
</div>
{%- endif -%}
