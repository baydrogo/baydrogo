<header class="ust">
  <div class="ust-kutu">
    <div class="h-card">
      <div class="ust-kimlik">
        <a class="site-adi p-name u-url u-uid" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      <p class="p-note gizli">{{ site.description }}</p>
    </div>
    <nav class="menu">
      <a href="{{ '/' | relative_url }}"{% if include.bolum == "akis" %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/yazilar/' | relative_url }}"{% if include.bolum == "yazilar" %} aria-current="page"{% endif %}>Yazılar</a>
      <a href="{{ '/notlar/' | relative_url }}"{% if include.bolum == "notlar" %} aria-current="page"{% endif %}>Notlar</a>
      <a href="{{ '/arsiv/' | relative_url }}"{% if include.bolum == "arsiv" %} aria-current="page"{% endif %}>Arşiv</a>
      <a href="{{ '/hakkinda/' | relative_url }}"{% if include.bolum == "hakkinda" %} aria-current="page"{% endif %}>Hakkında</a>
      <button class="tema-dugme" type="button" aria-label="Açık/koyu temayı değiştir" title="Temayı değiştir">
        <svg class="ay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="gunes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
